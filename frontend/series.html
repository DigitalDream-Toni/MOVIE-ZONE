<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Series - MOVIE ZONE</title>
  <script type="importmap">
    {
      "imports": {
        "@vercel/analytics": "./node_modules/@vercel/analytics/dist/index.mjs"
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='15' fill='%23e50914'/><text y='70' x='50' text-anchor='middle' font-size='60' fill='white' font-weight='bold'>MZ</text></svg>">
</head>
<body>

  <nav class="mz-nav">
    <div class="mz-nav-inner">
      <a href="index.html" class="mz-nav-logo"><span class="logo-icon">MZ</span>MOVIE ZONE</a>
      <div class="mz-nav-links">
        <a href="index.html">Home</a>
        <a href="movies.html">Movies</a>
        <a href="series.html" class="active">Series</a>
        <a href="genres.html">Genres</a>
      </div>
      <div class="mz-nav-search">
        <input type="text" placeholder="Search series..." aria-label="Search series">
        <button class="search-toggle" aria-label="Toggle search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </div>
      <button class="mz-menu-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <div class="mz-mobile-nav">
    <a href="index.html">Home</a>
    <a href="movies.html">Movies</a>
    <a href="series.html">Series</a>
    <a href="genres.html">Genres</a>
    <a href="search.html">Search</a>
  </div>

  <div class="mz-page-header">
    <h1 class="mz-page-title">Series</h1>
    <div class="mz-filter-bar" id="genre-filters"></div>
  </div>

  <section class="mz-section">
    <div class="mz-section-inner">
      <p class="mz-search-results-count" id="results-count"></p>
      <div class="mz-grid" id="series-grid"></div>
      <div class="mz-pagination" id="pagination"></div>
      <div class="mz-empty" id="empty-state" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
        <h3>No series found</h3>
        <p>Check back later for new series.</p>
      </div>
    </div>
  </section>

  <!-- Footer (rendered by js/app.js) -->
  <footer id="mz-footer-root"></footer>

  <script src="js/app.js"></script>
  <script>
    let activeGenre = null;
    let currentPage = 1;
    const PER_PAGE = 24;

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        // Load all series for genre filter list
        const allData = await api.get('/series?per_page=200');
        const allSeries = allData.series || [];
        const genres = [...new Set(allSeries.map(s => s.genre).filter(Boolean))].sort();
        const filterBar = document.getElementById('genre-filters');

        const allBtn = document.createElement('button');
        allBtn.className = 'mz-filter-btn active';
        allBtn.textContent = 'All';
        allBtn.onclick = () => { activeGenre = null; currentPage = 1; loadSeries(); };
        filterBar.appendChild(allBtn);

        genres.forEach(genre => {
          const btn = document.createElement('button');
          btn.className = 'mz-filter-btn';
          btn.textContent = genre;
          btn.onclick = () => { activeGenre = genre; currentPage = 1; loadSeries(); };
          filterBar.appendChild(btn);
        });

        loadSeries();
      } catch (err) {
        console.error('Failed to load series:', err);
      }
    });

    async function loadSeries() {
      let url = `/series?page=${currentPage}&per_page=${PER_PAGE}`;
      if (activeGenre) url += `&genre=${encodeURIComponent(activeGenre)}`;

      const data = await api.get(url);
      renderSeries(data.series, data.pagination);
    }

    function renderSeries(seriesList, pagination) {
      const grid = document.getElementById('series-grid');
      const empty = document.getElementById('empty-state');
      const count = document.getElementById('results-count');
      const paginationEl = document.getElementById('pagination');

      grid.innerHTML = '';
      paginationEl.innerHTML = '';

      if (seriesList.length === 0) {
        empty.style.display = 'block';
        count.textContent = '';
        return;
      }

      empty.style.display = 'none';
      const start = (pagination.page - 1) * pagination.per_page + 1;
      const end = Math.min(pagination.page * pagination.per_page, pagination.total);
      count.textContent = `Showing ${start}-${end} of ${pagination.total} series`;

      seriesList.forEach(s => grid.appendChild(createSeriesCard(s)));

      // Build pagination controls
      if (pagination.total_pages > 1) {
        let html = '';

        html += `<button class="mz-page-btn" ${!pagination.has_prev ? 'disabled' : ''} onclick="goToPage(${pagination.page - 1})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M15 18l-6-6 6-6"/></svg>
        </button>`;

        const totalPages = pagination.total_pages;
        const current = pagination.page;
        let pages = [];
        if (totalPages <= 7) {
          for (let i = 1; i <= totalPages; i++) pages.push(i);
        } else {
          pages = [1];
          if (current > 3) pages.push('...');
          for (let i = Math.max(2, current - 1); i <= Math.min(totalPages - 1, current + 1); i++) {
            pages.push(i);
          }
          if (current < totalPages - 2) pages.push('...');
          pages.push(totalPages);
        }

        pages.forEach(p => {
          if (p === '...') {
            html += `<span class="mz-page-dots">...</span>`;
          } else {
            html += `<button class="mz-page-btn ${p === current ? 'active' : ''}" onclick="goToPage(${p})">${p}</button>`;
          }
        });

        html += `<button class="mz-page-btn" ${!pagination.has_next ? 'disabled' : ''} onclick="goToPage(${pagination.page + 1})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M9 18l6-6-6-6"/></svg>
        </button>`;

        paginationEl.innerHTML = html;
      }
    }

    function goToPage(page) {
      currentPage = page;
      loadSeries();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
  <script type="module" src="js/analytics.js"></script>
</body>
</html>
