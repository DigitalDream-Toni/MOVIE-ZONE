<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOVIE ZONE - Premium Movie Streaming</title>
  <script type="importmap">
    {
      "imports": {
        "@vercel/analytics": "./node_modules/@vercel/analytics/dist/index.mjs"
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='15' fill='%23e50914'/><text y='70' x='50' text-anchor='middle' font-size='60' fill='white' font-weight='bold'>MZ</text></svg>">
</head>
<body>

  <!-- Navigation -->
  <nav class="mz-nav">
    <div class="mz-nav-inner">
      <a href="index.html" class="mz-nav-logo">
        <span class="logo-icon">MZ</span>
        MOVIE ZONE
      </a>

      <div class="mz-nav-links">
        <a href="index.html" class="active">Home</a>
        <a href="movies.html">Movies</a>
        <a href="series.html">Series</a>
        <a href="genres.html">Genres</a>
      </div>

      <div class="mz-nav-search">
        <input type="text" placeholder="Search movies..." aria-label="Search movies">
        <button class="search-toggle" aria-label="Toggle search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
      </div>

      <button class="mz-menu-toggle" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <!-- Mobile Navigation -->
  <div class="mz-mobile-nav">
    <a href="index.html">Home</a>
    <a href="movies.html">Movies</a>
    <a href="series.html">Series</a>
    <a href="genres.html">Genres</a>
    <a href="search.html">Search</a>
  </div>

  <!-- Featured hero -->
  <section class="mz-hero">
    <div id="hero-slides"></div>
  </section>

  <!-- Trending -->
  <section class="mz-section">
    <div class="mz-section-inner">
      <div class="mz-row" id="row-trending">
        <div class="mz-section-header">
          <h2 class="mz-section-title">🔥 Trending Now</h2>
          <a href="movies.html" class="mz-section-link">
            View All
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M9 18l6-6-6-6"/></svg>
          </a>
        </div>
        <div class="mz-row-scroll" id="scroll-trending"></div>
        <button class="mz-row-btn mz-row-btn-left" aria-label="Scroll left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="mz-row-btn mz-row-btn-right" aria-label="Scroll right">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- Random genre shelves (populated by home.js) -->
  <div id="genre-shelves"></div>

  <!-- Footer (rendered by js/app.js) -->
  <footer id="mz-footer-root"></footer>

  <script src="js/app.js"></script>
  <script src="js/home.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (window.HOME && typeof window.HOME.loadHomepage === 'function') {
        try {
          await window.HOME.loadHomepage();
        } catch (err) {
          console.error('Failed to load homepage data:', err);
        }
      } else {
        console.error('Failed to load homepage data: HOME.loadHomepage is not available (is js/home.js loaded?)');
      }
    });
  </script>
  <script type="module" src="js/analytics.js"></script>
</body>
</html>
