<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search - MOVIE ZONE</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='15' fill='%23e50914'/><text y='70' x='50' text-anchor='middle' font-size='60' fill='white' font-weight='bold'>MZ</text></svg>">
</head>
<body>

  <nav class="mz-nav">
    <div class="mz-nav-inner">
      <a href="index.html" class="mz-nav-logo"><span class="logo-icon">MZ</span>MOVIE ZONE</a>
      <div class="mz-nav-links">
        <a href="index.html">Home</a>
        <a href="movies.html">Movies</a>
        <a href="series.html">Series</a>
        <a href="genres.html">Genres</a>
      </div>
      <div class="mz-nav-search">
        <input type="text" placeholder="Search..." aria-label="Search">
        <button class="search-toggle" aria-label="Toggle search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </div>
      <button class="mz-menu-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <div class="mz-mobile-nav">
    <a href="index.html">Home</a>
    <a href="movies.html">Movies</a>
    <a href="series.html">Series</a>
    <a href="genres.html">Genres</a>
    <a href="search.html">Search</a>
  </div>

  <div class="mz-search-container">
    <div class="mz-search-input-wrapper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="search-input" class="mz-search-input" placeholder="Search movies, series, genres..." autofocus>
    </div>

    <p class="mz-search-results-count" id="results-count"></p>

    <div class="mz-grid" id="search-results"></div>

    <div class="mz-empty" id="empty-state" style="display: none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <h3 id="empty-title">Start searching</h3>
      <p id="empty-desc">Type a movie name, genre, or keyword above.</p>
    </div>
  </div>

  <!-- Footer (rendered by js/app.js) -->
  <footer id="mz-footer-root"></footer>

  <script src="js/app.js"></script>
  <script>
    let allMovies = [];
    let allSeries = [];
    let searchTimeout = null;

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const [moviesData, seriesData] = await Promise.all([
          api.get('/movies?per_page=200'),
          api.get('/series?per_page=200')
        ]);
        allMovies = moviesData.movies || [];
        allSeries = seriesData.series || [];

        const searchInput = document.getElementById('search-input');
        searchInput.addEventListener('input', (e) => {
          clearTimeout(searchTimeout);
          searchTimeout = setTimeout(() => performSearch(e.target.value.trim()), 200);
        });

        // Pre-fill from URL
        const q = getQueryParam('q');
        if (q) {
          searchInput.value = q;
          performSearch(q);
        }
      } catch (err) {
        console.error('Failed to load data:', err);
      }
    });

    function performSearch(query) {
      const grid = document.getElementById('search-results');
      const empty = document.getElementById('empty-state');
      const count = document.getElementById('results-count');
      const emptyTitle = document.getElementById('empty-title');
      const emptyDesc = document.getElementById('empty-desc');

      grid.innerHTML = '';

      if (!query || query.length < 2) {
        empty.style.display = 'block';
        emptyTitle.textContent = 'Start searching';
        emptyDesc.textContent = 'Type a movie name, genre, or keyword above.';
        count.textContent = '';
        return;
      }

      const term = query.toLowerCase();

      const matchedMovies = allMovies.filter(m =>
        (m.title && m.title.toLowerCase().includes(term)) ||
        (m.genre && m.genre.toLowerCase().includes(term)) ||
        (m.description && m.description.toLowerCase().includes(term)) ||
        (m.year && m.year.toString().includes(term))
      );

      const matchedSeries = allSeries.filter(s =>
        (s.title && s.title.toLowerCase().includes(term)) ||
        (s.genre && s.genre.toLowerCase().includes(term)) ||
        (s.description && s.description.toLowerCase().includes(term)) ||
        (s.year && s.year.toString().includes(term))
      );

      const total = matchedMovies.length + matchedSeries.length;

      if (total === 0) {
        empty.style.display = 'block';
        emptyTitle.textContent = 'No results found';
        emptyDesc.textContent = `No movies or series match "${query}". Try a different search.`;
        count.textContent = '';
        return;
      }

      empty.style.display = 'none';
      count.textContent = `Found ${total} result${total !== 1 ? 's' : ''} for "${query}"`;

      matchedSeries.forEach(s => grid.appendChild(createSeriesCard(s)));
      matchedMovies.forEach(m => grid.appendChild(createMovieCard(m)));
    }
  </script>
  <script type="module" src="js/analytics.js"></script>
</body>
</html>
